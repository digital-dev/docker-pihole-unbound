name: Weekly rebuild & publish

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [fork-weekly-rebuild, main]
    paths:
      - Dockerfile
      - data/**
      - 99-edns.conf
      - lighttpd-external.conf
      - .github/workflows/weekly-rebuild.yaml

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pihole-unbound

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest Unbound release and checksum
        id: unbound
        run: |
          set -euo pipefail
          tag=$(curl -fsSL https://api.github.com/repos/NLnetLabs/unbound/releases/latest | jq -r .tag_name)
          version="${tag#release-}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $version"; exit 1; }
          sha=$(curl -fsSL "https://nlnetlabs.nl/downloads/unbound/unbound-${version}.tar.gz.sha256" | awk '{print $1}')
          [[ "$sha" =~ ^[a-f0-9]{64}$ ]] || { echo "bad sha256: $sha"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (amd64) for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: true   # always re-run apk upgrade so security fixes are picked up
          tags: scan:candidate
          build-args: |
            UNBOUND_VERSION=${{ steps.unbound.outputs.version }}
            UNBOUND_SHA256=${{ steps.unbound.outputs.sha256 }}

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache" \
            aquasec/trivy:latest image \
              --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 scan:candidate

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.unbound.outputs.date }}-unbound-${{ steps.unbound.outputs.version }}
          build-args: |
            UNBOUND_VERSION=${{ steps.unbound.outputs.version }}
            UNBOUND_SHA256=${{ steps.unbound.outputs.sha256 }}
